description = "internship_project"
authors = [
    {name = "Katisvektavir",email = "86384829+Katisvektavir@users.noreply.github.com"}
]
requires-python = ">=3.10, <4.0"
dependencies = [
    "django-split-settings (>=1.3.2,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "django (==4.2)",
    "django-bootstrap-v5 (>=1.0.11,<2.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "psycopg (==3.1.8)",
