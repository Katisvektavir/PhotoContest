<!DOCTYPE html>
<html lang="en">
{% load static %}
{% load bootstrap5 %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'index.css' %}">
    <link rel="stylesheet" href="{% static 'fonts.css' %}">
    {% bootstrap_css %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
{% bootstrap_javascript %}
<div class="wrapper">
<header>
    header
</header>
<main>
    {% for post in posts_time_sort %}
        <div class="post_box rounded-3 p-4 border" id="post_box">
            <h2>{{ post.user.username }}</h2>
            <div class="post_content">
                <div class="post_images">
                {% for photo in post.photos.all %}
                    <img class="post_photo" src="{{ photo.image.url }}" alt="{{ photo.name }}">
                {% endfor %}
                </div>
                <span class="post_text bg-light rounded-2 border">{{ post.message }}</span>
            </div>
            <div class="post_action">
                <button class="btn btn-link text-danger" aria-label="Нравится" aria-pressed="false">
                    <i class="bi bi-heart"></i>
                </button>
                <span class="like_count">{{ post.likes.count }}</span>
                <button class="btn btn-link text-secondary" aria-label="Комментарии">
                    <i class="bi bi-chat-dots"></i>
                </button>
                <span class="comment_count">{{ post.comments.count }}</span>
            </div>
        </div>

    {% endfor %}

    <div class="modal fade" id="carousel_modal_window" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0 p-0 gap-3">
                <img id="modal_image" class="img-fluid d-block align-self-center" src="" >
                <span id="modal_text" class="align-self-center bg-light rounded-1 px-2"></span>
            </div>
        </div>
    </div>
</main>
<footer>
    Photocontest
</footer>
</div>
<script src="{% static 'scrypt.js' %}"></script>
</body>
</html>
