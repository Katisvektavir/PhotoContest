<!DOCTYPE html>
<html lang="en">
{% load static %}
{% load bootstrap5 %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'index.css' %}">
    <link rel="stylesheet" href="{% static 'fonts.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'sort.js' %}"></script>
</head>

<body>
{% bootstrap_javascript %}
<div class="wrapper">
<header>
    <div>
        <button class="sort-btn" data-sort="date">По дате</button>
        <button class="sort-btn" data-sort="like">По лайкам</button>
    </div>
</header>
<main>
    <div id="posts_container">
        {% include "posts_list.html" %}
    </div>
    <div class="modal fade" id="carousel_modal_window" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0 p-0 gap-3">
                <img id="modal_image" class="img-fluid d-block align-self-center" src="" >
                <span id="modal_text" class="align-self-center bg-light rounded-1 px-2"></span>
            </div>
        </div>
    </div>
</main>
<footer>
    Photocontest
</footer>
</div>
<script src="{% static 'modal_image.js' %}"></script>
</body>
</html>
