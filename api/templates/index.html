<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'index.css' %}">
</head>

<body>
<dev class="wrapper">
<header>
    header
</header>
<main>
    {% for post in posts_time_sort %}
    <dev class="post_box">
        <dev class="post_images">
        {% for photo in post.photos.all %}
            <img src="{{ photo.image.url }}">
        {% endfor %}
        </dev>
        <span class="post_text">{{ post.message }}</span>
    </dev>
    {% endfor %}
</main>
<footer>
    Photocontest
</footer>
</dev>
</body>
</html>
