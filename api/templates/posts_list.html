{% for post in posts %}
        <div class="post_box rounded-3 p-4 border" id="post-{{ post.id }}">
            <h2>{{ post.user.username }}</h2>
            <div class="post_content">
                <div class="post_images">
                {% for photo in post.photos.all %}
                    <img class="post_photo" src="{{ photo.image.url }}" alt="{{ photo.name }}">
                {% endfor %}
                </div>
                <span class="post_text bg-light rounded-2 border">{{ post.message }}</span>
            </div>
            <div class="post_action">
                <button class="btn btn-link text-danger like-post-btn" data-post-id="{{ post.id }}" aria-label="Нравится" aria-pressed="false">
                    <i class="bi bi-heart"></i>
                </button>
                <span class="like_count">{{ post.likes.count }}</span>
                <button class="btn btn-link text-secondary comments-btn" data-post-id="{{ post.id }}" aria-label="Показать комментарии">
                    <i class="bi bi-chat-dots"></i>
                </button>
                <span class="comment_count_post">{{ post.comments.count }}</span>
                <button class="btn btn-link text-secondary comments-write-btn"
                        data-post-id="{{ post.id }}"
                        data-target="#post-comment-form-{{ post.id }}"
                        aria-label="Написать комментарий">
                    <i class="bi bi-pencil"></i>
                </button>
                <form class="comment-form d-none"
                      data-post-id="{{ post.id }}"
                      id="post-comment-form-{{ post.id }}">
                    {% csrf_token %}
                    <textarea name="message" class="form-control" rows="2" placeholder="Написать комментарий..."></textarea>
                    <input type="hidden" name="parent_id" value="">
                    <button type="submit" class="btn btn-primary btn-sm mt-2">Отправить</button>
                </form>
            </div>
            <div class="comment_box" id="comments-{{ post.id }}"></div>
        </div>
{% endfor %}
