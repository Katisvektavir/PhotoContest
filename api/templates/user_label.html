{% if user.is_authenticated %}
    <a href="/user" class="text-decoration-none">
        <img class="header_user_avatar" src="{{ user.avatar_url }}">
    </a>
    <a class="text-decoration-none" href="/user">{{ user.username }}</a>
    <form method="post" action="{% url 'authentification:logout' %}" class="d-inline">
    {% csrf_token %}
        <button type="submit" class="btn btn-link text-decoration-none p-0 text-secondary" title="Выйти">
            <i class="bi bi-door-open"></i>
        </button>
    </form>
{% else %}
    <a href="/login">Войти!</a>
{% endif %}
