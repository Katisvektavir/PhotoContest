
server {
    listen       80;
    server_name  salt-and-pepper-internship.duckdns.org localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        proxy_pass http://django-site:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin {
         #allow 172.23.0.1;
         #allow 176.120.178.197;
         #allow 127.0.0.1;
         #deny all;
        proxy_pass http://django-site:8000;
    }

    location /static {
        root /var/www/html;
    }

    location /media {
        root /var/www/html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}


