worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;
    keepalive_timeout 30;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;
    include /etc/nginx/conf.d/*.conf;

}